<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>无法加载 Lingvist</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6f8;
        color: #1f2430;
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .card {
        max-width: 420px;
        padding: 32px 36px;
        background: #fff;
        border: 1px solid #e4e7ec;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 6px 24px rgba(20, 25, 40, 0.06);
      }
      h1 { font-size: 18px; margin: 0 0 10px; }
      p { font-size: 14px; line-height: 1.6; color: #5c6376; margin: 0 0 22px; }
      button {
        font: inherit;
        font-size: 14px;
        padding: 9px 22px;
        border: 0;
        border-radius: 8px;
        background: #2f6df6;
        color: #fff;
        cursor: pointer;
      }
      button:hover { background: #2760e0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>无法加载 Lingvist</h1>
      <p>可能是网络连接不可用，或 lingvist.com 暂时无法访问。请检查网络后重试。</p>
      <button id="retry">重试</button>
    </div>
    <script>
      document.getElementById('retry').addEventListener('click', () => {
        window.lingvistDesktop && window.lingvistDesktop.reload();
      });
    </script>
  </body>
</html>
